<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>几何战争 · 账号管理</title>
<style>body{margin:0;background:#12191d;color:#e8efee;font:16px system-ui}main{max-width:400px;margin:9vh auto;padding:24px;background:#202a2f;border-top:3px solid #d6b76c}label{display:grid;gap:5px;margin:16px 0}input,button{padding:10px;background:#111c21;border:1px solid #677b80;color:white;font:inherit}button{cursor:pointer}output{display:block;margin-top:14px}</style>
<main><h1>账号管理</h1><form><label>管理员密码<input name="admin" type="password" autocomplete="off" required></label><label>玩家账号<input name="login" required maxlength="32"></label><label>新密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button>重置密码并注销旧登录</button><output role="status"></output></form></main>
<script>const f=document.querySelector('form');f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button'),out=f.querySelector('output');btn.disabled=true;try{const endpoint=location.pathname==='/admin'?'/auth/admin-reset':'/Geometric-Warfare/auth/admin-reset';const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const data=await res.json();out.textContent=res.ok?'已重置密码，玩家需要重新登录。':data.error;if(res.ok)f.elements.password.value='';}catch{out.textContent='服务器连接失败';}finally{btn.disabled=false;}};</script></html>
